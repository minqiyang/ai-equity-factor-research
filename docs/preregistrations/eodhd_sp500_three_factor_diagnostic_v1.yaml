inference:
  primary_hypothesis_family:
    - MOM_12_1_MEAN_MONTHLY_RANK_IC_GREATER_THAN_ZERO
    - REV_1M_MEAN_MONTHLY_RANK_IC_GREATER_THAN_ZERO
    - LOW_VOL_3M_MEAN_MONTHLY_RANK_IC_GREATER_THAN_ZERO
  alternative: ONE_SIDED_POSITIVE_PREREGISTERED_DIRECTION
  familywise_alpha: 0.05
  multiplicity_method: HOLM
  holm_tie_breaker_factor_order:
    - MOM_12_1
    - REV_1M
    - LOW_VOL_3M
  holm_sequential_thresholds:
    - 0.016666666666666666
    - 0.025
    - 0.05
  holm_stop_rule: STOP_AT_FIRST_NON_REJECTION
  holm_index_origin: ONE_BASED_K_1_THROUGH_3
  holm_python_sorted_access: sorted_raw_p[k-1]
  holm_adjusted_p_value: "for k=1..3: min(1, max((3-j+1) * sorted_raw_p[j-1] for j=1..k))"
  holm_map_back: ORIGINAL_FACTOR_ORDER_AFTER_SORTED_RUNNING_MAX
  holm_golden_fixture:
    raw_factor_order:
      MOM_12_1: 0.04
      REV_1M: 0.01
      LOW_VOL_3M: 0.03
    sorted_factor_order:
      - REV_1M
      - LOW_VOL_3M
      - MOM_12_1
    multiplied_sorted:
      - 0.03
      - 0.06
      - 0.04
    adjusted_sorted_running_max:
      - 0.03
      - 0.06
      - 0.06
    adjusted_original_factor_order:
      MOM_12_1: 0.06
      REV_1M: 0.03
      LOW_VOL_3M: 0.06
    rejected_factor_ids:
      - REV_1M
  dependence_aware_method: OVERLAPPING_NONCIRCULAR_MOVING_BLOCK_BOOTSTRAP
  bootstrap_unit: COMMON_COMPLETE_CASE_MONTHLY_RANK_IC_RECORD
  complete_case_rule: ALL_THREE_PRIMARY_FACTOR_RANK_ICS_VALID
  missing_record_breaks_segment: true
  segment_boundaries:
    - FOLD_BOUNDARY
    - PURGED_MONTH
    - INVALID_OR_MISSING_MONTH
    - LEAVE_ONE_YEAR_OUT_GAP
  block_sampling: OVERLAPPING_NONCIRCULAR_UNIFORM_WITH_REPLACEMENT
  segment_block_length: min(6, segment_length)
  blocks_drawn_per_segment: ceil(segment_length / segment_block_length)
  concatenation: CHRONOLOGICAL_SEGMENT_ORDER_THEN_TRUNCATE_EACH_SEGMENT
  fold_weighting: RETAINED_COMPLETE_CASE_MONTH_COUNT
  joint_factor_draws: true
  rng_consumption_order: REPLICATE_MAJOR_THEN_CHRONOLOGICAL_SEGMENT
  block_start_draw_api: GENERATOR_INTEGERS_LOW_0_HIGH_N_MINUS_L_PLUS_1_SIZE_CEIL_N_OVER_L_ENDPOINT_FALSE
  draw_reuse_across_distributions: SAME_ROW_INDEX_VECTOR_FOR_UNCENTERED_AND_NULL_CENTERED_TABLES
  rng_passes_per_replicate: ONE_NO_SECOND_CENTERED_OR_UNCENTERED_PASS
  null_centering: SUBTRACT_EACH_FACTOR_GLOBAL_OBSERVED_COMPLETE_CASE_MEAN
  bootstrap_shared_draw_golden_fixture:
    replicates: 3
    segment_lengths:
      - 8
      - 7
    factor_columns:
      MOM_12_1: row_index / 100
      REV_1M: (14 - row_index) / 200
      LOW_VOL_3M: ((row_index % 4) - 1.5) / 100
    observed_means_factor_order:
      - 0.07
      - 0.035
      - -0.001
    starts_by_replicate_then_segment:

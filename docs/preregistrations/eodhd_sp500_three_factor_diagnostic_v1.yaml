schema_version: eodhd_sp500_three_factor_diagnostic_v1

campaign:
  campaign_id: eodhd_historical_sp500_price_factor_baselines_v1
  evidence_class: DIAGNOSTIC_ONLY
  semantic_trial_count: 14
  status: PROTOCOL_FROZEN_PENDING_BLINDED_DATA_ACCEPTANCE
  protocol_hash_location: DETACHED_POST_MERGE_RECORD
  code_sha_location: DETACHED_RUN_BINDING_AFTER_RUNNER_MERGE
  environment_identity_location: DETACHED_RUN_BINDING_AFTER_RUNNER_MERGE
  dataset_manifest_sha256_location: BLINDED_DATA_ACCEPTANCE_RECORD
  public_projection_sha256_location: BLINDED_DATA_ACCEPTANCE_RECORD_IF_LICENSED
  result_access_before_detached_run_binding: FORBIDDEN

provider:
  label: EODHD
  current_known_plan: EOD_HISTORICAL_DATA_ALL_WORLD
  historical_membership_entitlement: UNVERIFIED_PRIVATE_GATE
  retention_permission: UNVERIFIED_WRITTEN_PERMISSION_REQUIRED
  aggregate_publication_permission: UNVERIFIED_WRITTEN_PERMISSION_REQUIRED
  raw_publication: FORBIDDEN
  credentials_publication: FORBIDDEN
  purchase_by_codex: FORBIDDEN

dataset:
  universe_name: HISTORICAL_SP500_MEMBERS
  index_symbol: GSPC.INDX
  candidate_start: 2014-01-01
  cutoff_rule: LATEST_FULLY_INGESTED_SESSION_FROZEN_IN_BLINDED_DATA_ACCEPTANCE
  primary_quality_start: 2018-01-01
  pre_2018_classification: LIMITED_UNLESS_DATASET_REVIEW_ACCEPTS
  coverage_outputs:
    - coverage_all_available
    - coverage_primary_quality_window
    - coverage_pre_2018_limited
  required_roles:
    - historical_membership
    - member_eod
    - delisted_symbols
    - symbol_change_history
    - splits
    - dividends
    - benchmark_spy
  private_manifest_required: true
  safe_public_projection_required: CONDITIONAL_ON_WRITTEN_PERMISSION
  blinded_data_acceptance_required: true

identity:
  permanent_provider_security_id_available: false
  diagnostic_listing_key:
    - exchange
    - ticker
    - effective_from
    - effective_to
  canonical_tie_breaker: DIAGNOSTIC_LISTING_LINEAGE_KEY
  canonical_byte_encoding:
    version: listing_lineage_key_bytes_v1
    magic_ascii_then_zero_byte: listing_lineage_key_v1
    exchange: NFC_UTF8_PREFIXED_BY_UINT32_BIG_ENDIAN_BYTE_LENGTH
    ticker: NFC_UTF8_PREFIXED_BY_UINT32_BIG_ENDIAN_BYTE_LENGTH
    effective_from: STRICT_GREGORIAN_YYYY_MM_DD_EXACTLY_10_ASCII_BYTES
    effective_to_null: SINGLE_ZERO_BYTE
    effective_to_present: SINGLE_0X01_BYTE_THEN_STRICT_10_BYTE_ASCII_DATE
    effective_to_semantics: ENDPOINT_KNOWN_AT_FIRST_DECISION_TIME_ELIGIBILITY_ELSE_NULL
    key_freeze: FIRST_DECISION_TIME_ELIGIBILITY
    later_actual_endpoint_or_provider_backfill_rewrites_key: false
    string_constraints: NONEMPTY_UNICODE_SCALARS_NO_CONTROL_CHARACTERS
    transformations_forbidden:
      - TRIMMING
      - CASE_FOLDING
      - LOCALE_COLLATION
      - DELIMITER_SERIALIZATION
    ordering: LEXICOGRAPHIC_UNSIGNED_BYTES_ASCENDING
    uses:
      - FACTOR_TIE_BREAK
      - FACTOR_TURNOVER_ALIGNMENT
      - RANDOM_BASELINE_INPUT_ORDER
  symbol_change_chain_required: true
  collision_and_gap_report_required: true
  price_continuity_only_mapping: FORBIDDEN
  unresolved_return_relevant_identity_issue: BLOCK_AFFECTED_ROWS
  campaign_invalidation_thresholds:
    status: FREEZE_IN_BLINDED_DATA_ACCEPTANCE_WITHOUT_PERFORMANCE_ACCESS
    performance_informed_selection: FORBIDDEN

price_policy:
  factor_field: adjusted_close
  factor_field_claim: EODHD_DIVIDEND_AND_SPLIT_ADJUSTED_CLOSE_RETURN_PROXY
  forward_return_field: adjusted_close
  forward_return_kind: SIMPLE_NOT_LOG
  forward_return_formula: adjusted_close[label_end] / adjusted_close[label_start] - 1
  forward_return_label_start: EXECUTION_CLOSE
  forward_return_label_end: EXECUTION_CLOSE_PLUS_21_COMMON_CALENDAR_ROWS
  forward_return_anchor_validation: BOTH_REAL_NUMERIC_NON_BOOLEAN_PRESENT_FINITE_STRICTLY_POSITIVE
  invalid_forward_anchor_action: INVALIDATE_AND_RETAIN_FACTOR_MONTH_OUTCOME_WITH_REASON_COUNT
  invalid_forward_anchor_repairs: FORBIDDEN_ZERO_FILL_FORWARD_FILL_BACKWARD_FILL_INTERPOLATION_CLIPPING_ABSOLUTE_VALUE_ALTERNATE_ROW_OR_LOG_FALLBACK
  forward_return_golden_fixture:
    execution_adjusted_close: 100.0
    endpoint_adjusted_close: 121.0
    simple_return: 0.21
    forbidden_log_return: 0.1906203596086497
  exact_total_return_index_claim: FORBIDDEN_UNLESS_DATASET_REVIEW_VERIFIES
  raw_ohlc_use: PRIVATE_AUDIT_ONLY
  volume_use: FORBIDDEN_IN_CAMPAIGN
  liquidity_filter: NONE
  capacity_claim: FORBIDDEN
  share_level_execution_claim: FORBIDDEN
  raw_close_times_adjusted_volume: FORBIDDEN
  missing_fill: NONE
  security_specific_next_observation_substitution: FORBIDDEN
  terminal_event_policy:
    unresolved_terminal_economics: BLOCK_AFFECTED_ROWS
    silent_drop: FORBIDDEN
    zero_or_minus_one_imputation: FORBIDDEN
    arbitrary_next_observed_security_row: FORBIDDEN

universe:
  membership: POINT_IN_TIME_EFFECTIVE_AND_KNOWN_BY_SIGNAL_CUTOFF
  interval_boundary_rule: VERIFY_AND_FREEZE_IN_BLINDED_DATA_ACCEPTANCE
  unresolved_boundary_row: INVALID
  current_constituent_substitution: FORBIDDEN
  include_former_members: true
  include_delisted_where_available: true
  minimum_factor_history: FACTOR_SPECIFIC
  factor_month_minimum_eligible_securities: 100
  claim_scope: HISTORICAL_SP500_MEMBERS_ONLY

decision_time_eligibility:
  evaluation_cutoff: SIGNAL_CLOSE_T
  allowed_inputs:
    - POINT_IN_TIME_MEMBERSHIP_EFFECTIVE_AND_KNOWN_AT_T
    - LISTING_LINEAGE_RESOLVED_THROUGH_T
    - FACTOR_SPECIFIC_LOOKBACK_COMMON_CALENDAR_POSITION_SPAN_ADDRESSABLE_AT_T
    - FACTOR_SPECIFIC_REFERENCED_PRICE_ANCHORS_VALID_AT_T
    - FINITE_FACTOR_VALUE_AT_T
    - CORPORATE_ACTION_POLICY_INFORMATION_KNOWN_AT_T
  forbidden_inputs:
    - EXECUTION_PRICE_AVAILABILITY_AFTER_T
    - FORWARD_ENDPOINT_AVAILABILITY
    - LATER_HALT_OR_DELISTING
    - ANY_POST_T_RETURN_OR_AVAILABILITY_FIELD
  frozen_at_t:
    - ORDERED_ELIGIBLE_LISTING_KEY_SET
    - FACTOR_RANKS
    - DECILE_ASSIGNMENTS
    - LONG_ONLY_TARGET
    - MATCHED_BENCHMARK_MEMBERSHIP
  post_t_mutation_effect_on_frozen_objects: NONE_BYTE_IDENTICAL
  minimum_eligible_securities: 100

outcome_availability:
  diagnostic_missing_execution_to_endpoint_return:
    action: INVALIDATE_FACTOR_MONTH
    membership_or_target_recomputation: FORBIDDEN
  selected_strategy_missing_execution_price:
    action: INVALIDATE_AFFECTED_STRATEGY_TRIAL
    substitute_or_renormalize: FORBIDDEN
  strategy_missing_held_return:
    action: INVALIDATE_AFFECTED_STRATEGY_TRIAL
  matched_benchmark_missing_constituent_execution_or_return:
    action: INVALIDATE_COMPARISON
    membership_recomputation: FORBIDDEN

calendar_and_timing:
  calendar: XNYS_VERSION_BOUND_IN_BLINDED_DATA_ACCEPTANCE
  signal_frequency: MONTHLY
  signal_date_rule: LAST_COMMON_XNYS_SESSION_CLOSE_OF_CALENDAR_MONTH
  signal_availability: AFTER_CLOSE
  execution_contract: after_close_signal_next_observed_close_v1
  execution_row: NEXT_COMMON_XNYS_SESSION_CLOSE
  forward_horizon_return_rows: 21
  forward_endpoint: EXECUTION_CLOSE_PLUS_21_COMMON_CALENDAR_ROWS
  label_kind: execution_anchored_forward_return_v1
  label_start: SIGNAL_CLOSE_PLUS_1_COMMON_CALENDAR_ROW
  label_end: SIGNAL_CLOSE_PLUS_22_COMMON_CALENDAR_ROWS
  bounded_windows: REQUIRED
  walk_forward_folds: CALENDAR_YEAR_FOLDS_FROM_2018_PLUS_FINAL_BOUNDED_PARTIAL_YEAR
  later_data_in_earlier_fold: FORBIDDEN
  horizon_purge_signal_axis_rows: 22
  embargo_rows: 0
  embargo_reason: FIXED_FACTORS_NO_FIT_NO_TUNING_NO_ADAPTIVE_SELECTION
  cross_split_labels: FORBIDDEN
  common_calendar_endpoint_required: true

factors:
  - factor_id: MOM_12_1
    formula: adjusted_close[t-21] / adjusted_close[t-252] - 1
    direction: HIGHER_IS_BETTER
    referenced_price_anchors:
      - T_MINUS_252
      - T_MINUS_21
    price_anchor_validation: ALL_REAL_NUMERIC_NON_BOOLEAN_PRESENT_FINITE_STRICTLY_POSITIVE
    invalid_anchor_action: INVALID_MISSING_FACTOR_VALUE_EXCLUDE_LISTING_FROM_FACTOR_DECISION_TIME_ELIGIBILITY_AND_COUNT_REASON
    invalid_anchor_repairs: FORBIDDEN_ZERO_FILL_FORWARD_FILL_BACKWARD_FILL_INTERPOLATION_CLIPPING_ABSOLUTE_VALUE_OR_ALTERNATE_ROW
    lookback_common_calendar_positions: 253
    required_observed_price_anchors: 2
    intermediate_adjusted_close_values_required: false
    interior_missing_price_action: NO_FACTOR_VALUE_EFFECT_IF_REFERENCED_ANCHORS_VALID
    golden_fixture:
      adjusted_close_t_minus_252: 80.0
      adjusted_close_t_minus_21: 100.0
      factor_value: 0.25
  - factor_id: REV_1M
    formula: -(adjusted_close[t] / adjusted_close[t-21] - 1)
    direction: HIGHER_IS_BETTER
    referenced_price_anchors:
      - T_MINUS_21
      - T
    price_anchor_validation: ALL_REAL_NUMERIC_NON_BOOLEAN_PRESENT_FINITE_STRICTLY_POSITIVE
    invalid_anchor_action: INVALID_MISSING_FACTOR_VALUE_EXCLUDE_LISTING_FROM_FACTOR_DECISION_TIME_ELIGIBILITY_AND_COUNT_REASON
    invalid_anchor_repairs: FORBIDDEN_ZERO_FILL_FORWARD_FILL_BACKWARD_FILL_INTERPOLATION_CLIPPING_ABSOLUTE_VALUE_OR_ALTERNATE_ROW
    lookback_common_calendar_positions: 22
    required_observed_price_anchors: 2
    intermediate_adjusted_close_values_required: false
    interior_missing_price_action: NO_FACTOR_VALUE_EFFECT_IF_REFERENCED_ANCHORS_VALID
    golden_fixture:
      adjusted_close_t_minus_21: 100.0
      adjusted_close_t: 90.0
      factor_value: 0.10
  - factor_id: LOW_VOL_3M
    formula: "-std([adjusted_close[d] / adjusted_close[d-1] - 1 for d=t-62..t], ddof=1)"
    direction: HIGHER_IS_BETTER
    one_day_return_kind: SIMPLE_NOT_LOG
    one_day_return_formula: adjusted_close[d] / adjusted_close[d-1] - 1
    return_row_range: D_EQUALS_T_MINUS_62_THROUGH_T_INCLUSIVE
    required_return_rows: 63
    required_history_price_anchors: 64
    price_anchor_range: T_MINUS_63_THROUGH_T_INCLUSIVE
    price_anchor_validation: REAL_NUMERIC_NON_BOOLEAN_PRESENT_FINITE_STRICTLY_POSITIVE
    invalid_anchor_action: INVALID_MISSING_FACTOR_VALUE_EXCLUDE_LISTING_FROM_FACTOR_DECISION_TIME_ELIGIBILITY_AND_COUNT_REASON
    invalid_anchor_repairs: FORBIDDEN_ZERO_FILL_FORWARD_FILL_BACKWARD_FILL_INTERPOLATION_CLIPPING_ABSOLUTE_VALUE_ALTERNATE_ROW_OR_LOG_FALLBACK
    slice_convention: PYTHON_HALF_OPEN_END_T_PLUS_1_INCLUDES_T
    golden_fixture:
      simple_return_sequence: 0.001_THROUGH_0.063_STEP_0.001
      simple_negative_sample_std_ddof_1: -0.01833030277982336
      forbidden_log_negative_sample_std_ddof_1: -0.017765781758667692

factor_diagnostics:
  quantiles: 10
  rank_ic: SPEARMAN_AVERAGE_TIE_RANKS_THEN_PEARSON
  minimum_distinct_factor_values: 10
  minimum_distinct_forward_returns: 2
  winsorization: NONE
  normalization: NONE
  post_result_sign_reversal: FORBIDDEN
  binning: HIGH_TO_LOW_EQUAL_COUNT_TOP_REMAINDER_FIRST
  tie_breaker: DIAGNOSTIC_LISTING_LINEAGE_KEY
  decile_size_rule: "base=N//10; first N%10 high-ranked deciles receive base+1"
  decile_output_order: D1_LOW_TO_D10_HIGH
  adjacent_monotonicity: "mean(D{k+1}) - mean(D{k}) for k=1..9"
  monotonicity_share: FRACTION_OF_9_ADJACENT_DIFFERENCES_NONNEGATIVE
  fully_monotone: ALL_9_ADJACENT_DIFFERENCES_NONNEGATIVE
  factor_turnover: TARGET_TO_TARGET_UNDIVIDED_SUM_ABSOLUTE_WEIGHT_CHANGES
  factor_turnover_target_schedule: EVERY_SCHEDULED_SIGNAL_MONTH_FREEZES_TOP_DECILE_OR_ENUMERATED_ZERO_TARGET
  factor_turnover_predecessor: IMMEDIATELY_PRECEDING_SCHEDULED_FROZEN_DECISION_TIME_TARGET
  factor_turnover_zero_target_predecessor: INCLUDED
  factor_turnover_outcome_validity_dependence: FORBIDDEN
  outcome_invalid_middle_target_retention: RETAIN_AS_NEXT_TURNOVER_PREDECESSOR
  outcome_invalid_factor_turnover_reporting: RETAIN_WITH_SEPARATE_OUTCOME_INVALID_FLAG
  first_scheduled_factor_turnover: NOT_APPLICABLE
  outputs:
    - coverage
    - invalid_and_missing_counts
    - descriptive_mean_rank_ic_all_valid_factor_months
    - descriptive_median_rank_ic_all_valid_factor_months
    - descriptive_rank_ic_std_ddof_1_all_valid_factor_months
    - descriptive_monthly_icir_all_valid_factor_months
    - primary_mean_rank_ic_common_complete_case
    - primary_common_complete_case_count
    - dependence_aware_interval
    - holm_adjusted_direction_test
    - decile_returns
    - top_minus_bottom_spread
    - adjacent_decile_monotonicity
    - factor_turnover
    - yearly_results
    - leave_one_year_out
    - contribution_by_year
    - contribution_by_security_where_additive
  top_minus_bottom_is_tradable_short_strategy: false

strategy:
  portfolio: LONG_ONLY_TOP_DECILE_EQUAL_WEIGHT
  episode_21_row_return_use: FACTOR_AND_DECILE_DIAGNOSTIC_ONLY_NOT_COMPOUNDED
  return_object: CONTINUOUS_DAILY_NEXT_MONTHLY_EXECUTION_TO_EXECUTION_PATH
  first_earned_return: EXECUTION_CLOSE_TO_NEXT_COMMON_CALENDAR_CLOSE
  final_target_without_later_execution: INVALID_FOR_CONTINUOUS_STRATEGY
  zero_target_decision_time_conditions:
    - ELIGIBLE_SECURITY_COUNT_BELOW_100_AT_T
    - DISTINCT_FINITE_FACTOR_VALUE_COUNT_BELOW_10_AT_T
    - DUPLICATE_CANONICAL_LISTING_KEY_BYTES_AT_T
  invalid_rebalance_action: ZERO_TARGET_AT_NEXT_EXECUTION
  all_other_zero_target_triggers: FORBIDDEN
  later_unselected_diagnostic_outcome_failure:
    may_invalidate_factor_month_or_comparison: true
    strategy_target_mutation: FORBIDDEN
    liquidation_creation: FORBIDDEN
    cash_path_mutation: FORBIDDEN
  selected_target_missing_execution_price: INVALIDATE_AFFECTED_STRATEGY_TRIAL
  selected_execution_failure_zero_target_rewrite: FORBIDDEN
  missing_held_return: INVALIDATE_AFFECTED_STRATEGY_TRIAL
  missing_held_return_zero_target_rewrite: FORBIDDEN
  primary_benchmark: FACTOR_MATCHED_CONTINUOUS_EQUAL_WEIGHT_DECISION_TIME_ELIGIBLE_UNIVERSE
  primary_benchmark_membership_freeze: SIGNAL_CLOSE_T
  future_availability_membership_recomputation: FORBIDDEN
  primary_benchmark_comparison_gap: INVALIDATE_REQUIRED_PRIMARY_COMPARISON
  primary_benchmark_comparison_gap_final_state: INVALID_DIAGNOSTIC_HARD_VALIDITY_FAILURE
  primary_benchmark_gap_is_coverage_or_false_economic_predicate: false
  secondary_benchmark: SPY_ADJUSTED_CLOSE_PROXY_ON_IDENTICAL_DAILY_INTERVALS
  missing_spy_return: INVALIDATE_SECONDARY_COMPARISON_ONLY
  secondary_spy_comparison_final_state_role: DESCRIPTIVE_ONLY_NO_EFFECT
  invalid_comparison_interval_omission_or_fill: FORBIDDEN
  economically_supported_benchmark: PRIMARY_FACTOR_MATCHED_BENCHMARK_ONLY
  shorting: false
  borrow_assumptions: NONE
  turnover_convention: UNDIVIDED_SUM_ABSOLUTE_WEIGHT_CHANGES_FROM_DRIFTED_WEIGHTS
  initial_deployment_turnover: 1.0
  full_switch_turnover: 2.0
  terminal_liquidation: NONE_AFTER_FINAL_MEASURED_RETURN
  cost_cases_bps:
    - 0
    - 10
    - 25
  primary_cost_bps: 10
  gross_multiplier: 1 + gross_return
  cost_formula: gross_multiplier * turnover * bps / 10000
  cost_return_basis: BEGINNING_PERIOD_RETURN_IMPACT_OF_POST_RETURN_EQUITY_CHARGE
  cost_application: DEDUCT_ONCE_FROM_PORTFOLIO_EQUITY_AT_EXECUTION_CLOSE
  fixed_bps_interpretation: ALL_IN_DIAGNOSTIC_EXECUTION_COST_PROXY
  included_components:
    - COMMISSION
    - BID_ASK_SPREAD
    - SLIPPAGE
    - EXCHANGE_AND_REGULATORY_FEES
    - OTHER_ORDINARY_EXECUTION_FRICTION
  separately_added_components: NONE
  excluded_models:
    - TAX
    - BORROW
    - MARKET_IMPACT
    - CAPACITY
    - PARTICIPATION_RATE
    - CALIBRATED_FILL
  unit_gross_multiplier_cost_fixtures:
    turnover_0_4:
      bps_0: 0.0
      bps_10: 0.0004
      bps_25: 0.0010
    turnover_1_0:
      bps_0: 0.0
      bps_10: 0.0010
      bps_25: 0.0025
    turnover_2_0:
      bps_0: 0.0
      bps_10: 0.0020
      bps_25: 0.0050
  nonzero_incoming_return_cost_fixture:
    gross_return: 0.10
    gross_multiplier: 1.10
    turnover: 2.0
    bps: 25
    beginning_period_cost_impact: 0.0055
    net_return: 0.0945
  random_rank_primary_cost_fixture:
    gross_return: 0.10
    gross_multiplier: 1.10
    turnover: 2.0
    bps: 10
    beginning_period_cost_impact: 0.0022
    net_return: 0.0978
  zero_cost_interpretation: DIAGNOSTIC_ONLY

trials:
  inventory_path: eodhd_sp500_three_factor_trial_inventory_v1.json
  exact_count: 14
  hidden_trials: FORBIDDEN
  exact_rerun_classification: ATTEMPT_OF_EXISTING_SEMANTIC_TRIAL

baselines:
  random_rank_top_decile:
    seed_preimage: random_rank_v1|20260729|factor_id|signal_date_t_YYYY-MM-DD
    date_token: SIGNAL_DATE_T_STRICT_YYYY_MM_DD_NOT_EXECUTION_DATE
    input_order: ASCENDING_CANONICAL_LISTING_KEY_UNSIGNED_BYTES
    permutation_input: INTEGER_INDICES_0_THROUGH_N_MINUS_1
    permutation_interpretation: HIGH_TO_LOW_RANDOM_RANK
    top_decile_size: N // 10 + (1 if N % 10 else 0)
    selection: FIRST_TOP_DECILE_SIZE_PERMUTED_INDICES
    forbidden_selection: LAST_CHUNK_OR_FLOOR_ONLY_SIZE
    target_weight: 1 / selected_count
